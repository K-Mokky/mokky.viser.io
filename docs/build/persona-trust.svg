<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="Trusted globals versus untrusted memory">
  <rect width="920" height="280" fill="#0c111d"/>
  <text x="28" y="36" fill="#e6edf7" font-size="20" font-family="ui-sans-serif, system-ui, sans-serif">Trust boundary in composePrompt</text>
  <rect x="28" y="60" width="260" height="180" rx="16" fill="#052e16" stroke="#86efac"/>
  <text x="158" y="96" text-anchor="middle" fill="#86efac" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">Trusted</text>
  <text x="158" y="128" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">system prompt</text>
  <text x="158" y="150" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">runtime context</text>
  <text x="158" y="172" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">safety contract</text>
  <text x="158" y="194" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">operator globals</text>
  <rect x="330" y="60" width="260" height="180" rx="16" fill="#111827" stroke="#f59e0b"/>
  <text x="460" y="96" text-anchor="middle" fill="#f59e0b" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">Untrusted fence</text>
  <text x="460" y="128" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">memory / profile</text>
  <text x="460" y="150" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">skills / plugins</text>
  <text x="460" y="172" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">transcript</text>
  <text x="460" y="194" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">user / messenger text</text>
  <rect x="632" y="60" width="260" height="180" rx="16" fill="#162238" stroke="#60a5fa"/>
  <text x="762" y="96" text-anchor="middle" fill="#60a5fa" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif">Handoff</text>
  <text x="762" y="140" text-anchor="middle" fill="#e6edf7" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">spawn local CLI</text>
  <text x="762" y="162" text-anchor="middle" fill="#9fb0c6" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">no API key env</text>
  <text x="762" y="184" text-anchor="middle" fill="#9fb0c6" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">no shell expansion</text>
  <line x1="288" y1="150" x2="330" y2="150" stroke="#9fb0c6" stroke-width="2"/>
  <line x1="590" y1="150" x2="632" y2="150" stroke="#9fb0c6" stroke-width="2"/>
</svg>
